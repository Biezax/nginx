name: Build and test packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      nginx_version:
        description: Nginx version
        required: true
        default: '1.30.7'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - id: version
        run: echo "revision=$(date -u +%Y%m%d%H%M).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: ubuntu20
            ubuntu: '20.04'
          - profile: ubuntu22
            ubuntu: '22.04'
          - profile: ubuntu24
            ubuntu: '24.04'
    env:
      NGINX_VERSION: ${{ inputs.nginx_version || '1.30.7' }}
      PACKAGE_BASE_NAME: nginx-custom
      PACKAGE_REVISION: ${{ needs.prepare.outputs.revision }}
      PROFILE: ${{ matrix.profile }}
      UBUNTU_VERSION: ${{ matrix.ubuntu }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build packages
        run: |
          mkdir -p "output/$PROFILE"
          docker compose --profile "$PROFILE" up --build \
            --abort-on-container-failure --exit-code-from "nginx-build-$PROFILE" \
            "nginx-build-$PROFILE"

      - name: Verify package output
        run: |
          cd "output/$PROFILE"
          expected_version="$NGINX_VERSION-1ubuntu$UBUNTU_VERSION.$PACKAGE_REVISION"
          expected_file="${PACKAGE_BASE_NAME}_${expected_version}_amd64.deb"
          test "$(cat package-file.txt)" = "$expected_file"
          test "$(wc -l < package-files.txt)" -eq 4
          while IFS= read -r package_file; do
            case "$package_file" in
              nginx-custom_*.deb|nginx-custom-focal_*.deb|nginx-custom-jammy_*.deb|nginx-custom-noble_*.deb) ;;
              *) echo "Invalid package filename: $package_file" >&2; exit 1 ;;
            esac
            test "$(dpkg-deb -f "$package_file" Version)" = "$expected_version"
            test "$(dpkg-deb -f "$package_file" Architecture)" = amd64
          done < package-files.txt
          sha256sum -- *.deb > SHA256SUMS
          cat build-info.txt

      - name: Test packages and seamless upgrade
        run: bash tests/run-package-tests.sh "$PROFILE" "$UBUNTU_VERSION"

      - name: Save tested packages
        uses: actions/upload-artifact@v7
        with:
          name: nginx-${{ matrix.profile }}
          path: output/${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Save failure logs
        if: failure()
        run: docker compose --profile "$PROFILE" logs --no-color

      - name: Clean up build containers
        if: always()
        run: docker compose --profile "$PROFILE" down --volumes --remove-orphans

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: nginx-ubuntu*
          path: packages

      - name: Build and test release images
        run: |
          for ubuntu in 20.04 22.04 24.04; do
            dir="packages/nginx-ubuntu${ubuntu%%.*}"
            (cd "$dir" && sha256sum -c SHA256SUMS)
            package="$dir/$(cat "$dir/package-file.txt")"
            package_version=$(dpkg-deb -f "$package" Version)
            version=${package_version%%-*}
            [[ "$package_version" == "$version-1ubuntu$ubuntu."* ]]
            image="ghcr.io/${GITHUB_REPOSITORY,,}:$version-ubuntu$ubuntu"
            docker build -f Dockerfile.runtime --build-arg "UBUNTU_VERSION=$ubuntu" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.version=$version" -t "$image" "$dir"
            test "$(docker run --rm "$image" nginx -v 2>&1)" = "nginx version: nginx/$version"
            container=$(docker run -d -p 127.0.0.1::80 "$image")
            trap 'docker rm -f "$container" >/dev/null' EXIT
            address=$(docker port "$container" 80/tcp)
            curl --fail --silent --show-error --retry 5 --retry-connrefused "http://$address/" >/dev/null
            docker rm -f "$container" >/dev/null
            trap - EXIT
            echo "$image" >> "$RUNNER_TEMP/nginx-images"
          done

      - name: Publish images to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          while IFS= read -r image; do
            docker push "$image"
            docker pull "$image"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
            echo "$image -> $digest" | tee -a "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/nginx-images"

      - name: Publish release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir release
          cp packages/nginx-ubuntu*/*.deb release/
          cd release
          sha256sum -- *.deb > SHA256SUMS
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "$RELEASE_TAG" -- *.deb SHA256SUMS
